# 20M-token TinyStories quality run.

model:
  vocab_size: 50257
  max_seq_len: 512
  d_model: 384
  num_layers: 6
  num_heads: 6
  d_ff: 1536
  dropout: 0.1
  bias: true
  use_sinusoidal_pos: false
  position_embedding_type: rope
  norm_type: rmsnorm
  num_kv_heads: 2
  use_flash_attention: true
  ffn_activation: swiglu

data:
  dataset_name: tinystories
  num_train: 5000
  num_val: 500

training:
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  use_amp: true
  log_interval: 100
  eval_interval: 400
  save_interval: 2000
  checkpoint_dir: checkpoints/small_tinystories_20m
  experiment_dir: experiments
  run_name: small_tinystories_20m
