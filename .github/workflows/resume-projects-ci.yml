name: ML resume project evidence

on:
  push:
    paths:
      - "mini-gpt/**"
      - "ddpm-cifar10-from-scratch/**"
      - "mistral-7b-qlora-lora-finetuning/**"
      - "credit-risk-customer-lifecycle-analytics/**"
      - ".github/workflows/resume-projects-ci.yml"
  pull_request:
    paths:
      - "mini-gpt/**"
      - "ddpm-cifar10-from-scratch/**"
      - "mistral-7b-qlora-lora-finetuning/**"
      - "credit-risk-customer-lifecycle-analytics/**"
      - ".github/workflows/resume-projects-ci.yml"
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - mini-gpt
          - ddpm-cifar10-from-scratch
          - mistral-7b-qlora-lora-finetuning
          - credit-risk-customer-lifecycle-analytics
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
