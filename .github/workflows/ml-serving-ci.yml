name: ML serving evidence

on:
  push:
    paths:
      - "real-time-model-serving-monitoring/**"
      - ".github/workflows/ml-serving-ci.yml"
  pull_request:
    paths:
      - "real-time-model-serving-monitoring/**"
      - ".github/workflows/ml-serving-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-time-model-serving-monitoring
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: real-time-model-serving-monitoring/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
